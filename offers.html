<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Mall - Offers</title>
    <style>
         *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f4ede0;
            color: #222;
            line-height: 1.6;
        }

        a{
            text-decoration: none;
            color: inherit;
        }

        
        header{
            background-color: #2b0f1e;
            padding: 15px 30px;
        }
        nav{
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;

        }
        .logo{
            color: #f4ede0;
            font-size: 22px;
            font-weight: bold;
        }

        .logo span{
            color: #c9a24b;

        }

        nav ul{
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav ul li a{
            color: #e4cf9a;
            font-size: 14px;
        }
        nav ul li a:hover{
            color: #ffffff;
            text-decoration: underline;
        }

        nav ul li a.active{
            color: #ffffff;
            font-weight: bold;


        }

        /*banner*/
        .page-banner {
            background-color: #3a1528;
            color: #f4ede0;
            padding: 50px 30px;
            text-align: center;
        }
 
        .page-banner h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }
 
        .page-banner p {
            font-size: 15px;
            color: #d9c9b8;
            max-width: 600px;
            margin: 0 auto;
        }
        /* ---------- main section ---------- */
        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 50px 30px;
        }
        
        .section-title {
            font-size: 26px;
            color: #2b0f1e;
            margin-bottom: 25px;
            border-bottom: 3px solid #c9a24b;
            padding-bottom: 8px;
            display: inline-block;
        }
        
        /* ---------- simple search box ---------- */
        .search-box {
            margin-bottom: 35px;
        }
        
        .search-box input {
            width: 100%;
            max-width: 400px;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>

    
</head>
<body>
    <header>
        <nav>
            <div class="logo">CITY <span>MALL</span></div>
            <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="shops.html">Shops</a></li>
            <li><a href="events.html">Events</a></li>
            <li><a href="offers.html" class="active">Offers</a></li>
            <li><a href="posters.html">Posters</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
 
    <div class="page-banner">
        <h1>Discount Offers</h1>
        <p>Current deals across the mall. Show the code at checkout — offers refresh weekly.</p>
    </div>

    
</body>
</html>

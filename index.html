<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Mall - Home</title>
    <style>
        .ticker{
            background-color: #1c0d14;
            color: #e4cf9a;
            font-size: 13px;
            padding: 8px;
            text-align: center;   
        }
        /*  HEADER / NAVIGATION BAR */
        nav{
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;

        }
        .logo{
            color: #f4ede0;
            font-size: 22px;
            font-weight: bold;
        }

        .logo span{
            color: #c9a24b;

        }
        header{
            background-color: #2b0f1e;
            padding: 15px 30px;
        }
        a{
            text-decoration: none;
            color: inherit;
        }
        nav ul{
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav ul li a{
            color: #e4cf9a;
            font-size: 14px;
        }
        nav ul li a:hover{
            color: #ffffff;
            text-decoration: underline;
        }

        nav ul li a.active{
            color: #ffffff;
            font-weight: bold;


        }
        
        /* GENERAL SECTION SPACING */
        section {
        max-width: 1100px;
        margin: 0 auto;
        padding: 50px 20px;
        }
        
        .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 30px;
        }
        
        .section-head h2 {
        color: #2b0f1e;
        font-size: 28px;
        }
        
        .section-head a {
        font-size: 13px;
        color: #1f5c53;
        border: 1px solid #1f5c53;
        padding: 6px 12px;
        border-radius: 3px;
        }
        /* HERO SECTION (big top banner)*/
        .hero {
        background-color: #2b0f1e;
        color: #f4ede0;
        padding: 60px 20px;
        text-align: left;
        }
        
        .hero-inner {
        max-width: 1100px;
        margin: 0 auto;
        }
        
        .hero h1 {
        font-size: 48px;
        font-weight: 900;
        margin-bottom: 15px;
        line-height: 1.15;
        }
        
        .hero h1 em {
        color: #e4cf9a;
        font-style: italic;
        font-weight: 600;
        }
        
        .hero p {
        max-width: 500px;
        color: #d9c9b8;
        margin-bottom: 25px;
        }
        
        .btn {
        display: inline-block;
        padding: 12px 20px;
        font-size: 13px;
        text-transform: uppercase;
        border-radius: 3px;
        font-weight: bold;
        margin-right: 10px;
        }
        
        .btn-gold {
        background-color: #c9a24b;
        color: #2b0f1e;
        }
        
        .btn-outline {
        border: 1px solid #c9a24b;
        color: #e4cf9a;
        }
        
        .hero-stats {
        display: flex;
        gap: 35px;
        margin-top: 40px;
        flex-wrap: wrap;
        border-top: 1px solid rgba(201,162,75,.3);
        padding-top: 20px;
        }
        
        .hero-stats .num {
        color: #c9a24b;
        font-size: 24px;
        font-weight: bold;
        display: block;
        }
        
        .hero-stats .lbl {
        color: #b8a798;
        font-size: 11px;
        text-transform: uppercase;
        }

        /* ITEM FINDER (search box) */
        .finder {
        background-color: #2b0f1e;
        color: #f4ede0;
        padding: 30px;
        border-radius: 5px;
        }
        
        .finder h2 {
        margin-bottom: 5px;
        }
        
        .finder p {
        color: #c9b8a8;
        font-size: 14px;
        margin-bottom: 20px;
        }
        
        #itemSearch {
        width: 100%;
        max-width: 400px;
        padding: 12px;
        font-size: 15px;
        border: 1px solid #c9a24b;
        border-radius: 3px;
        background-color: #3a1528;
        color: #f4ede0;
        box-sizing: border-box;
        }
        
        .chip-row {
        margin-top: 15px;
        }
        
        .chip {
        background: none;
        border: 1px solid #c9a24b;
        color: #e4cf9a;
        font-size: 12px;
        padding: 6px 12px;
        border-radius: 15px;
        margin: 4px 4px 0 0;
        cursor: pointer;
        }
        
        .chip:hover {
        background-color: #c9a24b;
        color: #2b0f1e;
        }
        
        #finderResults {
        margin-top: 20px;
        }
        
        .result-row {
        background-color: rgba(244,237,224,.08);
        border: 1px solid rgba(201,162,75,.3);
        padding: 12px 16px;
        border-radius: 3px;
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        }
        
        .result-row .shopname {
        font-weight: bold;
        }
        
        .result-row .cat {
        font-size: 12px;
        color: #c9a24b;
        text-transform: uppercase;
        }
        
        .finder-empty {
        color: #9a8878;
        font-style: italic;
        }
        /* SHOP CARDS (grid of boxes) */
        .shop-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 18px;
        }
        
        .shop-card {
        background-color: #ffffff;
        border: 1px solid #e6dbc8;
        border-radius: 4px;
        overflow: hidden;
        }
        
        .shop-banner {
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #ffffff;
        font-weight: bold;
        padding: 0 10px;
        }
        
        .shop-body {
        padding: 15px;
        }
        
        .shop-body .cat-label {
        font-size: 11px;
        color: #1f5c53;
        text-transform: uppercase;
        margin-bottom: 5px;
        }
        
        .shop-body h3 {
        color: #2b0f1e;
        margin: 0 0 8px 0;
        }
        
        .shop-body .items {
        font-size: 13px;
        color: #5a4c40;
        margin-bottom: 10px;
        }
        
        .discount-badge {
        display: inline-block;
        background-color: #c9a24b;
        color: #2b0f1e;
        font-size: 11px;
        font-weight: bold;
        padding: 4px 10px;
        border-radius: 15px;
        }
        .cat-jewelry    { background-color: #8a4a2f; }
        .cat-kids       { background-color: #3a5f70; }
        .cat-arcade     { background-color: #5c2d6e; }
        .cat-cinema     { background-color: #2c2c44; }
        .cat-icecream   { background-color: #a85a7c; }
        .cat-shoes      { background-color: #5c3d22; }
        .cat-fitness    { background-color: #1f4d40; }
        .cat-toys       { background-color: #a86a1f; }
        .cat-grocery    { background-color: #354f20; }
        .cat-books      { background-color: #282342; }
        .cat-electronics{ background-color: #1b333f; }
        .cat-beauty     { background-color: #7d3350; }

        /* EVENTS LIST */
        .event-row {
        background-color: #ffffff;
        border: 1px solid #e6dbc8;
        display: flex;
        gap: 20px;
        padding: 18px;
        margin-bottom: 8px;
        align-items: center;
        flex-wrap: wrap;
        }
        
        .event-date {
        text-align: center;
        min-width: 60px;
        }
        
        .event-date .day {
        font-size: 24px;
        font-weight: bold;
        color: #2b0f1e;
        display: block;
        }
        
        .event-date .mon {
        font-size: 11px;
        color: #1f5c53;
        text-transform: uppercase;
        }
        
        .event-info h4 {
        color: #2b0f1e;
        margin: 0 0 4px 0;
        }
        
        .event-info p {
        font-size: 13px;
        color: #5a4c40;
        margin: 0;
        }
        
        .event-loc {
        font-size: 11px;
        color: #1f5c53;
        text-transform: uppercase;
        }
        /* FOOTER */
        footer {
        background-color: #2b0f1e;
        color: #c9b8a8;
        padding: 40px 20px;
        margin-top: 40px;
        }
        
        .footer-inner {
        max-width: 1100px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 20px;
        }
        
        .footer-inner a {
        display: block;
        font-size: 13px;
        margin-bottom: 6px;
        }
        
        .footer-inner strong {
        color: #e4cf9a;
        }
        
        footer .fine {
        text-align: center;
        font-size: 12px;
        margin-top: 25px;
        border-top: 1px solid rgba(201,162,75,.2);
        padding-top: 15px;
        }
    </style>
</head>

        </nav>
    </header>
    
</body>
</html>
